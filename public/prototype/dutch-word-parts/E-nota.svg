<svg id="mEnota" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="max-width: 800px;" role="graphics-document document" aria-roledescription="venn"><style>#mEnota{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mEnota .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mEnota .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mEnota .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#mEnota .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#mEnota .edge-thickness-normal{stroke-width:1px;}#mEnota .edge-thickness-thick{stroke-width:3.5px;}#mEnota .edge-pattern-solid{stroke-dasharray:0;}#mEnota .edge-thickness-invisible{stroke-width:0;fill:none;}#mEnota .edge-pattern-dashed{stroke-dasharray:3;}#mEnota .edge-pattern-dotted{stroke-dasharray:2;}#mEnota .marker{fill:#0b0b0b;stroke:#0b0b0b;}#mEnota .marker.cross{stroke:#0b0b0b;}#mEnota svg{font-family:Inter,Arial,sans-serif;font-size:16px;}#mEnota p{margin:0;}#mEnota .venn-title{font-size:32px;fill:rgb(8.5000000002, 5.7500000001, 0);font-family:Inter,Arial,sans-serif;}#mEnota .venn-circle text{font-size:48px;font-family:Inter,Arial,sans-serif;}#mEnota .venn-intersection text{font-size:48px;fill:#333;font-family:Inter,Arial,sans-serif;}#mEnota .venn-text-node{font-family:Inter,Arial,sans-serif;color:#333;}#mEnota .node .neo-node{stroke:hsl(40.5882352941, 60%, 83.3333333333%);}#mEnota [data-look="neo"].node rect,#mEnota [data-look="neo"].cluster rect,#mEnota [data-look="neo"].node polygon{stroke:url(#mEnota-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mEnota [data-look="neo"].swimlane.cluster rect{filter:none;}#mEnota [data-look="neo"].node path{stroke:url(