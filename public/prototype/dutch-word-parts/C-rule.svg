<svg id="mCrule" width="100%" xmlns="http://www.w3.org/2000/svg" class="railroad-diagram" style="max-width: 534.8125px;" viewBox="0 0 534.8125 166" role="graphics-document document" aria-roledescription="railroadEbnf"><style>#mCrule{font-family:Inter,Arial,sans-serif;font-size:22px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mCrule .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mCrule .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mCrule .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#mCrule .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#mCrule .edge-thickness-normal{stroke-width:1px;}#mCrule .edge-thickness-thick{stroke-width:3.5px;}#mCrule .edge-pattern-solid{stroke-dasharray:0;}#mCrule .edge-thickness-invisible{stroke-width:0;fill:none;}#mCrule .edge-pattern-dashed{stroke-dasharray:3;}#mCrule .edge-pattern-dotted{stroke-dasharray:2;}#mCrule .marker{fill:#0b0b0b;stroke:#0b0b0b;}#mCrule .marker.cross{stroke:#0b0b0b;}#mCrule svg{font-family:Inter,Arial,sans-serif;font-size:22px;}#mCrule p{margin:0;}#mCrule .railroad-diagram{font-family:Inter,Arial,sans-serif;font-size:22px;}#mCrule .railroad-terminal rect{fill:#ffffde;stroke:hsl(-79.4117647059, 60%, 83.3333333333%);stroke-width:2px;}#mCrule .railroad-terminal text{fill:rgb(11.0000000001, 34.0000000002, 0);font-family:Inter,Arial,sans-serif;font-size:22px;text-anchor:middle;dominant-baseline:middle;}#mCrule .railroad-nonterminal rect{fill:#fff4dd;stroke:hsl(40.5882352941, 60%, 83.3333333333%);stroke-width:2px;}#mCrule .railroad-nonterminal text{fill:#333;font-family:Inter,Arial,sans-serif;font-size:22px;text-anchor:middle;dominant-baseline:middle;}#mCrule .railroad-line{stroke:#0b0b0b;stroke-width:2px;fill:none;}#mCrule .r