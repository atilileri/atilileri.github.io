# The Plan — the route to the exam, and the position on it.
# Docent reads it whole every Session. The format is .agents/skills/docent/PLAN-FORMAT.md.
# Sources: Taalprofielen 2015 (SLO) for the language Objectives, Bijlage 2 of the
# Regeling inburgering 2021 (consolidated 2026-04-18) for KNM.
horizon: "2027-03-31"
objectives:
  - id: LEB1-1a
    skill: lezen
    tier: exam
    status: active
    text: >-
      Kan persoonlijke brieven, e-mails en vormen van sociale media voldoende begrijpen om met iemand te
      kunnen corresponderen.
    angles:
      - "lexicon: introducing yourself in a group chat"
    sessions:
      - 2026-10-21-padel-app
  - id: LEB1-1b
    skill: lezen
    tier: exam
    status: todo
    text: Kan een eenvoudige formele brief of e-mail voldoende begrijpen om adequaat te kunnen reageren.
  - id: LEB1-2a
    skill: lezen
    tier: exam
    status: todo
    text: >-
      Kan relevante informatie vinden en begrijpen in brochures en korte officiële documenten op internet of
      in andere media.
  - id: LEB1-2b
    skill: lezen
    tier: exam
    status: todo
    text: >-
      Kan in langere teksten op internet of in andere media informatie zoeken over thema's binnen het eigen
      interessegebied (B1+).
  - id: LEB1-3a
    skill: lezen
    tier: exam
    status: todo
    text: Kan belangrijke feitelijke informatie begrijpen in korte verslagen en artikelen.
  - id: LEB1-3b
    skill: lezen
    tier: exam
    status: todo
    text: Kan eenvoudige jeugdliteratuur lezen.
  - id: LEB1-3c
    skill: lezen
    tier: exam
    status: todo
    text: Kan door meelezen alledaags audiovisueel materiaal begrijpen.
  - id: LEB1-3d
    skill: lezen
    tier: exam
    status: todo
    text: >-
      Kan hoofdthema en belangrijkste argumenten begrijpen in eenvoudige teksten in tijdschriften, kranten of
      op internet (B1+).
  - id: LEB1-4a
    skill: lezen
    tier: exam
    status: todo
    text: Kan helder geschreven, ondubbelzinnige instructies begrijpen.
  - id: SCHB1-1a
    skill: schrijven
    tier: exam
    status: active
    text: >-
      Kan persoonlijke brieven en e-mails schrijven of gebruikmaken van andere vormen van sociale media waarin
      ervaringen, gevoelens en gebeurtenissen enigszins gedetailleerd worden beschreven.
    angles:
      - "lexicon: telling a neighbour about a change in the neighbourhood"
    sessions:
      - 2026-10-22-post-in-de-bus
  - id: SCHB1-1b
    skill: schrijven
    tier: exam
    status: todo
    text: Kan op advertenties reageren.
  - id: SCHB1-1c
    skill: schrijven
    tier: exam
    status: todo
    text: >-
      Kan deelnemen aan discussies over bekende thema's of over thema's uit het interessegebied via sociale
      media zoals internet.
  - id: SCHB1-1d
    skill: schrijven
    tier: exam
    status: todo
    text: >-
      Kan persoonlijke brieven schrijven waarin nieuws wordt overgebracht en gedachten over abstracte of
      culturele onderwerpen worden uitgedrukt (B1+).
  - id: SCHB1-2a
    skill: schrijven
    tier: exam
    status: todo
    text: >-
      Kan notities en berichten schrijven die eenvoudige informatie bevatten die van direct belang is voor
      vrienden, dienstverleners, onderwijzers, en anderen die een rol in zijn/haar dagelijks leven spelen, en
      daarbij begrijpelijk de punten overbrengen waarvan hij of zij vindt dat ze belangrijk zijn.
  - id: SCHB1-2b
    skill: schrijven
    tier: exam
    status: todo
    text: Kan formulieren waarin meer informatie gevraagd wordt, gedetailleerd invullen.
  - id: SCHB1-3a
    skill: schrijven
    tier: exam
    status: todo
    text: Kan een kort, eenvoudig verslag schrijven volgens een vast format.
  - id: SCHB1-3b
    skill: schrijven
    tier: exam
    status: todo
    text: Kan korte, eenvoudige opstellen schrijven over belangwekkende onderwerpen (B1+).
  - id: SCHB1-3c
    skill: schrijven
    tier: exam
    status: todo
    text: >-
      Kan met enig vertrouwen verzamelde feitelijke informatie over vertrouwde alledaagse en niet- alledaagse
      zaken binnen zijn of haar vakgebied samenvatten, in een verslag opnemen en becommentariëren (B1+).
  - id: SCHB1-4a
    skill: schrijven
    tier: exam
    status: todo
    text: Kan gedetailleerde beschrijvingen geven van bekende onderwerpen binnen het eigen interessegebied.
  - id: SCHB1-4b
    skill: schrijven
    tier: exam
    status: todo
    text: Kan verslag doen van ervaringen en daarbij gevoelens en reacties op gebeurtenissen beschrijven.
  - id: SCHB1-4c
    skill: schrijven
    tier: exam
    status: todo
    text: Kan een verhaal schrijven over een onderwerp dat hem/haar interesseert.
