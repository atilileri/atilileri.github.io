zorgverzekering:
  nl: zorgverzekering
  article: de
  tr: sağlık sigortası
  en: health insurance
  split:
    parts:
      - nl: zorg
        tr: bakım
        en: care
        role: stem
      - nl: verzekering
        tr: sigorta
        en: insurance
        role: stem2
        parts:
          - nl: ver-
            tr: fiil yapan ön ek
            en: verb prefix
            role: affix
          - nl: zeker
            tr: emin
            en: sure
            role: stem2
          - nl: "-ing"
            tr: "-me (isim yapar)"
            en: "-ing"
            role: affix
    literal: bakımı emin kılma
    why: >-
      `verzekeren` ‘emin kılmak’, yani sigortalamak. Bakım masrafını güvenceye alan şey → sağlık
      sigortası.
