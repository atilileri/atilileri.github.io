aanvraag:
  nl: aanvraag
  article: de
  tr: başvuru, talep
  en: application, request
  split:
    parts:
      - nl: aan
        tr: "-e, -a"
        en: on, to
        role: stem
      - nl: vraag
        tr: soru
        en: question
        role: stem2
        istek: null
    literal: birine sorma
    why: "`aanvragen` bir kurumdan resmî olarak bir şey istemek. O isteğin kendisi → başvuru."
achter:
  nl: achter
  tr: arkasında, arkada
  en: behind
  bridge: Futbolda ‘ahter’ (savunma, arka) kelimesini hatırlatır. Tersi `voor` (önünde).
afgesloten:
  nl: afgesloten
  tr: (yol) kapalı, kapatılmış
  en: closed off
  trap:
    from: en
    text: >-
      İngilizce `closed` aklıyla her kapalı şeye `afgesloten` dersin: `De winkel is afgesloten.`
      Dükkân için `gesloten` ya da `dicht` denir. `afgesloten` bir yolun, bir alanın erişime
      kapatılması: `De weg is afgesloten.`
  pictures:
    trap: >-
      Solda kırmızı beyaz bariyerlerle kapatılmış bir yol, üstünde ‘De weg is afgesloten’; sağda
      kapısında ‘Gesloten’ tabelası olan bir dükkân.
afspraak:
  nl: afspraak
  article: de
  tr: randevu; anlaşma
  en: appointment; agreement
  split:
    parts:
      - nl: af-
        tr: bitirme, kesinleştirme
        en: off, done
        role: affix
      - nl: spraak
        tr: konuşma
        en: speech
        role: stem
    literal: konuşulup kesinleşen şey
    why: >-
      `afspreken` ‘konuşup kesinleştirmek, anlaşmak’. Kesinleşen buluşma → randevu; kesinleşen karar
      → anlaşma.
  trap:
    from: tr
    text: >-
      Türkçede randevu ‘alınır’. Bu yüzden `een afspraak nemen` dersin ve bir şey yanlış duyulmaz.
      Ama Hollandacada randevu ‘yapılır’: `een afspraak maken`. Doktordan istersen: `Ik wil graag
      een afspraak maken.`
  pictures:
    trap: >-
      İki konuşma balonu: üstü çizili ‘een afspraak nemen’ ve yanında yeşil tik ile ‘een afspraak
      maken’; arkada bir takvim ve bir doktor muayenehanesi kapısı.
afstand:
  nl: afstand
  article: de
  tr: mesafe
  en: distance
  split:
    parts:
      - nl: af
        tr: uzağa
        en: off, away
        role: affix
      - nl: stand
        tr: duruş
        en: stand
        role: stem
    literal: uzakta duruş
    why: "Otobüs etiketi: `Houd drie meter afstand.` Üç metre mesafe bırak."
allemaal:
  nl: allemaal
  tr: hepsi, herkes (hep birlikte)
  en: all, everybody
  bridge: "`al` (bütün) + `maal` (kere) gibi okunur: ‘hep birden’. Grup selamı: `Hoi allemaal!`"
alles:
  nl: alles
  tr: her şey
  en: everything
  trap:
    from: en
    text: >-
      İngilizce `all` aklıyla insanlara da `alles` dersin: `Hoi alles!` Ama `alles` yalnızca şeyler
      için: her şey. İnsanlar için `allemaal`: `Hoi allemaal!` Pazarda: `Dat is alles` (hepsi bu,
      başka bir şey yok).
  pictures:
    trap: >-
      Solda bir grup insana el sallayan bir kişi, konuşma balonunda ‘Hoi allemaal!’ ve yeşil tik;
      sağda üstü çizili ‘Hoi alles!’; altta dolu bir pazar sepeti ve ‘Dat is alles’.
altijd:
  nl: altijd
  tr: her zaman
  en: always
  split:
    parts:
      - nl: al
        tr: bütün
        en: all
        role: stem
      - nl: tijd
        tr: zaman
        en: time
        role: stem2
    literal: bütün zaman
anders-nog-iets:
  nl: anders nog iets
  tr: başka bir şey (ister misiniz)?
  en: anything else?
  split:
    parts:
      - nl: anders
        tr: başka
        en: else
        role: stem
      - nl: nog
        tr: daha
        en: still
        role: stem2
      - nl: iets
        tr: bir şey
        en: something
        role: stem2
    literal: başka daha bir şey
    why: >-
      Pazarda satıcının sorusu: `Anders nog iets?` Cevap: `Nee, dat was het` ya da `Dat is alles,
      dank je.`
annuleren:
  nl: annuleren
  tr: iptal etmek
  en: to cancel
  bridge: >-
    İngilizce `annul` (geçersiz kılmak) ve Fransızca `annuler` ile neredeyse aynı kelime. Geçmiş
    zaman sıfatı: `geannuleerd` (iptal edilmiş).
aow:
  nl: AOW
  article: de
  tr: devletin emekli aylığı
  en: state pension
  bridge: >-
    `AOW` = `Algemene Ouderdomswet`, Genel Yaşlılık Yasası. Hollanda'da yaşadığın her yıl için biraz
    birikir.
apotheek:
  nl: apotheek
  article: de
  tr: eczane
  en: pharmacy
  bridge: İngilizce `apothecary` (eski usul eczacı) ile aynı kelime.
  trap:
    from: en
    text: >-
      İngilizcedeki `drugstore` aklıyla Kruidvat'a ya da Etos'a `apotheek` dersin. Onlar `drogist`:
      reçetesiz ürün satar. `de apotheek` reçeteli ilacı veren yer; huisarts'ın yazdığı reçeteyle
      oraya gidersin.
  pictures:
    trap: >-
      Bir Hollanda sokağında iki dükkân: yeşil haçlı ‘Apotheek’ (reçeteli ilaç) ve şampuan, vitamin
      satan ‘Drogist’.
baan:
  nl: baan
  article: de
  tr: iş (bir pozisyon)
  en: job
  trap:
    from: tr
    text: >-
      Türkçede ‘iş’ hem yaptığın şey hem de pozisyonun. Hollandacada pozisyon `de baan`, işe gitmek
      ise `werk`: `Ik heb een nieuwe baan`, ama `Ik ga naar mijn werk`. `Ik ga naar mijn baan`
      yanlış duyulur. Dikkat: padel'de `de baan` kort demek. Onu Session 4'te göreceğiz.
  pictures:
    trap: >-
      Solda bir iş sözleşmesi ve bir masa, üstünde ‘een nieuwe baan’; sağda işe bisikletle giden bir
      kişi, üstünde ‘naar mijn werk’; altta üstü çizili ‘naar mijn baan’.
baan-2:
  nl: baan
  article: de
  tr: kort, saha, pist
  en: court, track
  bridge: >-
    `baan`ın temel anlamı ‘şerit, pist’: `rijbaan` (araç şeridi), `ijsbaan` (buz pisti), `startbaan`
    (uçak pisti). Padel'de kort, hayatta ise bir kariyer yolu, yani iş (`de baan`, Session 3).
bedrijfsarts:
  nl: bedrijfsarts
  article: de
  tr: işyeri doktoru
  en: company doctor, occupational physician
  split:
    parts:
      - nl: bedrijf
        tr: şirket
        en: company
        role: stem
      - nl: "-s-"
        tr: bağlayıcı ses
        en: linking sound
        role: link
      - nl: arts
        tr: doktor
        en: doctor
        role: stem2
    literal: şirket doktoru
    why: Seni tedavi etmez; ne zaman ve nasıl işe dönebileceğine bakar. Tedavi `huisarts`ın işi.
bekendmaking:
  nl: bekendmaking
  article: de
  tr: resmî duyuru, ilan
  en: public notice
  split:
    parts:
      - nl: bekend
        tr: bilinen
        en: known
        role: stem
      - nl: mak
        tr: yapmak
        en: make
        base: maak
        role: stem2
      - nl: "-ing"
        tr: "-me (isim yapar)"
        en: "-ing"
        role: affix
    literal: bilinir yapma
    why: >-
      `bekendmaken` ‘bilinir yapmak’, yani herkese duyurmak. Belediyenin herkese duyurduğu karar →
      resmî ilan.
    spelling: >-
      `maak` burada `mak` yazılır: `ma-king` hecesi açık, ve açık hecede uzun ünlü tek harfle
      yazılır.
belasting:
  nl: belasting
  article: de
  tr: vergi
  en: tax
  hook: >-
    `belasting` = 'bela' + 'sting'. Sahne: her yıl mayısta posta kutundan bir zarf çıkıyor, bir arı
    gibi seni sokuyor (İngilizce `sting`): 'Bela!' Bela gibi sokan şey: `de belasting`.
  split:
    parts:
      - nl: be-
        tr: fiil yapan ön ek
        en: verb prefix
        role: affix
      - nl: last
        tr: yük
        en: load
        role: stem
      - nl: "-ing"
        tr: "-me (isim yapar)"
        en: "-ing"
        role: affix
    literal: yük bindirme
    why: >-
      `belasten` ‘birine yük bindirmek’. Devletin vatandaşa bindirdiği yük → vergi. `de
      Belastingdienst` vergi dairesi.
  pictures:
    hook: >-
      Bir posta kutusundan çıkan, iğneli bir arıya dönüşmüş bir zarf bir kişiyi sokuyor; kişi
      ‘Bela!’ diye bağırıyor; zarfın üstünde ‘belasting’ yazıyor.
beschikbaar:
  nl: beschikbaar
  tr: müsait, mevcut, boş
  en: available
  split:
    parts:
      - nl: beschik
        tr: elinde bulundurmak
        en: dispose
        role: stem
      - nl: "-baar"
        tr: "-ılabilir"
        en: "-able"
        role: affix
    literal: elde bulundurulabilir
    why: "`beschikken over` ‘bir şeye sahip olmak’. Kullanılabilecek durumda → mevcut, boş."
besluit:
  nl: besluit
  article: het
  tr: karar
  en: decision
  split:
    parts:
      - nl: be-
        tr: fiil yapan ön ek
        en: verb prefix
        role: affix
      - nl: sluit
        tr: kapatmak
        en: close
        role: stem
    literal: kapatma
    why: Bir konuyu kapatmak, yani onu karara bağlamak. Türkçede de bir tartışmayı ‘kapatırız’.
bestaand:
  nl: bestaand
  tr: mevcut, var olan
  en: existing
  bridge: "`bestaan` (var olmak) fiilinden: `een bestaand gebouw` var olan bir bina."
betreffen:
  nl: betreffen
  tr: ilgilendirmek, hakkında olmak
  en: to concern
  bridge: >-
    Mektupların başında `Betreft:` = ‘Konu:’. Sözlük biçimi `betreffen`, ama mektupta hep `betreft`
    görürsün.
blauw:
  nl: blauw
  tr: mavi
  en: blue
  bridge: İngilizce `blue`, Almanca `blau`. Peakz'ın en üst üyeliği `Blue`, kendi renkleri de mavi.
blijven:
  nl: blijven
  tr: kalmak
  en: to stay, to remain
  hook: >-
    `blijven` kulağa 'bil, yeğen!' gibi gelir. Sahne: bisiklete binen yeğenine otobüsün arkasından
    sesleniyorsun: 'Bil, yeğen: sağda kal!' Etiket de aynısını söyler: `Blijf rechts achter mij.`
  pictures:
    hook: >-
      Bir otobüsün arkasında sağ şeritte duran genç bir bisikletli; kaldırımdaki bir yetişkin el
      sallıyor, konuşma balonunda ‘Bil, yeğen!’; otobüsün arkasında ‘Blijf rechts achter mij’
      etiketi.
boeken:
  nl: boeken
  tr: rezervasyon yapmak
  en: to book
  trap:
    from: en
    text: >-
      `boeken` aynı zamanda `boek` (kitap) kelimesinin çoğulu: kitaplar. Peakz'daki `Boek een baan`
      düğmesini ‘bir kitap’ diye okuyabilirsin. Burada `boek` fiildir, emir: ‘bir kort ayırt!’
      Bağlam karar verir: `de boeken` kitaplar, `ik boek` rezervasyon yapıyorum.
  pictures:
    trap: >-
      Solda bir padel kortu ve büyük bir ‘Boek een baan’ düğmesi, yeşil tik; sağda üstü çizili bir
      kitap yığını; ortada bir soru işareti.
bom:
  nl: bom
  article: de
  tr: bomba
  en: bomb
  bridge: İngilizce `bomb`. Kısa `o`.
boom:
  nl: boom
  article: de
  tr: ağaç
  en: tree
  bridge: >-
    İngilizce `beam` (kiriş, eskiden ağaç gövdesi) ile akraba görünür. Uzun `oo`. Çoğulu tek `o`
    ile: `bomen`.
  trap:
    from: en
    text: >-
      `boom` İngilizcede ‘bum!’ patlama sesi. `De boom van Eindhoven` levhasını ‘Eindhoven
      patlaması’ diye okumak kolay. Hollandacada `de boom` ağaç; patlama `de knal` ya da `boem!`.
  pictures:
    trap: >-
      Solda büyük yeşil bir ağaç, altında ‘de boom’ ve yeşil tik; sağda üstü çizili bir patlama
      bulutu ‘BOOM!’.
boot:
  nl: boot
  article: de
  tr: tekne, gemi
  en: boat
  bridge: "İngilizce `boat`. Uzun `oo`. Çoğulu `boten`: açık hecede tek `o` yeter."
  trap:
    from: en
    text: >-
      `boot` İngilizcede çizme. `We gaan met de boot naar Engeland` cümlesinde bir an çizme
      düşünürsün. Hollandacada `de boot` tekne; çizme `de laars`.
  pictures:
    trap: >-
      Solda denizde bir tekne ve altında yeşil tik ile ‘de boot’; sağda üstü çizili bir lastik
      çizme; tekne üstünde bir bisiklet.
bot:
  nl: bot
  article: het
  tr: kemik
  en: bone
  bridge: Kısa `o`. Çoğulu `botten`. `boot` (tekne) ile karıştırma.
bruin:
  nl: bruin
  tr: kahverengi
  en: brown
  bridge: "İngilizce `brown`, Almanca `braun`. `ui` Türkçede olmayan bir ses: ‘öy’e yakın."
buurt:
  nl: buurt
  article: de
  tr: mahalle, civar
  en: neighbourhood
  bridge: >-
    İngilizce `neighbour` kelimesi ‘yakın’ + ‘oturan’ demekti; sonundaki `-bour`, Hollandaca `buur`
    (komşu) ile aynı kökten gelir. `de buurt` komşuların olduğu yer, yani mahalle. Kaynak:
    https://en.wiktionary.org/wiki/neighbour
buurtbewoner:
  nl: buurtbewoner
  article: de
  tr: mahalle sakini
  en: local resident
  split:
    parts:
      - nl: buurt
        tr: mahalle
        en: neighbourhood
        role: stem
      - nl: bewoner
        tr: sakin, oturan
        en: resident
        role: stem2
        parts:
          - nl: be-
            tr: fiil yapan ön ek
            en: verb prefix
            role: affix
          - nl: won
            tr: oturmak
            en: live
            base: woon
            role: stem2
          - nl: "-er"
            tr: "-an, -en (kişi)"
            en: "-er"
            role: affix
    literal: mahallede oturan
    spelling: >-
      `woon` burada `won` yazılır: `wo-ner` hecesi açık, ve açık hecede uzun ünlü tek harfle
      yazılır.
deelname:
  nl: deelname
  article: de
  tr: katılım
  en: participation
  split:
    parts:
      - nl: deel
        tr: pay
        en: part
        role: stem
      - nl: name
        tr: almak
        en: take
        base: nemen
        role: stem2
    literal: pay alma
    spelling: "`nemen` burada `name` olur: fiilden isim yapılırken ünlü değişir (`nemen` → `name`)."
deelnemer:
  nl: deelnemer
  article: de
  tr: katılımcı
  en: participant
  split:
    parts:
      - nl: deel
        tr: pay
        en: part
        role: stem
      - nl: nemer
        tr: alan
        en: taker
        role: stem2
    literal: pay alan
    why: "`deelname` (katılım, Session 4) ile aynı kökler. `werknemer` (Session 3) gibi `-nemer`."
doorbetalen:
  nl: doorbetalen
  tr: ödemeye devam etmek
  en: to continue paying
  split:
    parts:
      - nl: door
        tr: devam, sürdürme
        en: on, through
        role: affix
      - nl: betalen
        tr: ödemek
        en: pay
        role: stem
    literal: ödemeyi sürdürmek
    why: >-
      `door` fiilin önünde ‘devam et’ demek: `doorgaan` (devam etmek), `doorwerken` (çalışmaya devam
      etmek).
dorp:
  nl: dorp
  article: het
  tr: köy, kasaba
  en: village
  bridge: İngilizce yer adlarındaki `-thorpe` ve Almanca `Dorf` ile benzer.
douane:
  nl: douane
  article: de
  tr: gümrük
  en: customs
  bridge: >-
    `douane` Fransızca üzerinden Arapça `dīwān`dan, o da Farsça `divân`dan gelir. Türkçe `divan`
    aynı kelime: Osmanlıda devlet kurulu. Kaynak: https://en.wiktionary.org/wiki/douane
drukte:
  nl: drukte
  article: de
  tr: kalabalık, yoğunluk
  en: crowds, busyness
  split:
    parts:
      - nl: druk
        tr: kalabalık
        en: busy
        role: stem
      - nl: "-te"
        tr: "-lık (isim yapar)"
        en: "-ness"
        role: affix
    literal: kalabalıklık
    why: "`druk` kalabalık, yoğun: `Het is druk.` Ondan isim: `de drukte`."
duidelijk:
  nl: duidelijk
  tr: açık, net, anlaşılır
  en: clear
  split:
    parts:
      - nl: duide
        tr: işaret etmek
        en: point out
        base: duiden
        role: stem
      - nl: "-lijk"
        tr: "-li (sıfat)"
        en: "-ly"
        role: affix
    literal: işaret edilebilir
    why: >-
      Parmakla gösterilebilecek kadar belli olan → açık, net. Episode'larda sık: `Het is nog niet
      duidelijk.`
dus:
  nl: dus
  tr: yani, bu yüzden
  en: so, therefore
  hook: >-
    `dus` kulağa 'duş' gibi gelir. Sahne: HIIT dersinden sırılsıklam çıkıyorsun: `Ik heb gesport,
    dus ik ga douchen.` Spor yaptım, bu yüzden duş. Sebepten sonuca giden köprü: `dus`.
  pictures:
    hook: >-
      Spor salonundan terli çıkmış bir kişi doğrudan bir duşa yürüyor; duşun üstünde büyük harflerle
      ‘DUS’ yazıyor; arkada bir spor salonu.
eerlijk:
  nl: eerlijk
  tr: dürüst; adil
  en: honest; fair
  split:
    parts:
      - nl: eer
        tr: onur
        en: honour
        role: stem
      - nl: "-lijk"
        tr: "-li (sıfat)"
        en: "-ly"
        role: affix
    literal: onurlu
    why: Onurlu davranan → dürüst, adil. `Eerlijk gezegd…` Açıkçası…
ergens:
  nl: ergens
  tr: bir yerde, bir yere
  en: somewhere
  bridge: "`n` alınca `nergens` (hiçbir yerde) olur. `Ergens in de markt…` Pazarda bir yerde…"
evenement:
  nl: evenement
  article: het
  tr: etkinlik, organizasyon
  en: event
  bridge: "İngilizce `event`, Fransızca `événement`. Vurgu sonda: ‘e-ve-ne-MENT’."
geel:
  nl: geel
  tr: sarı
  en: yellow
  hook: >-
    `geel` kulağa Türkçe 'gel!' gibi gelir. Sahne: sarı bir ANWB arabası yolda bozulan bir arabanın
    yanında durur ve sürücü camdan el sallar: 'Gel, gel!' Sarı araba 'gel' der: `geel`.
  pictures:
    hook: >-
      Yol kenarında sarı bir yol yardım arabası duruyor; sürücü el sallıyor, konuşma balonunda
      ‘Gel!’ yazıyor; arabanın yanında büyük harflerle ‘GEEL’ yazıyor.
gevaarlijk:
  nl: gevaarlijk
  tr: tehlikeli
  en: dangerous
  split:
    parts:
      - nl: gevaar
        tr: tehlike
        en: danger
        role: stem
      - nl: "-lijk"
        tr: "-li (sıfat)"
        en: "-ly"
        role: affix
    literal: tehlikeli
goud:
  nl: goud
  article: het
  tr: altın
  en: gold
  bridge: "İngilizce `gold`. Sıfatı `gouden`: `een gouden lidmaatschap`, `Gold`. Peakz'daki seviyen."
  trap:
    from: en
    text: >-
      İngilizcede `gold medal`, `gold card` dersin; madde adı aynı zamanda sıfat. Hollandacada sıfat
      `-en` alır: `een gouden medaille`, `een zilveren kaart`. `een goud medaille` yanlış duyulur.
  pictures:
    trap: >-
      Altın bir madalya, üstünde ‘een gouden medaille’ ve yeşil tik; yanında üstü çizili ‘een goud
      medaille’; altta gümüş bir kart ‘een zilveren kaart’.
graag:
  nl: graag
  tr: memnuniyetle; severek; lütfen (istekte)
  en: gladly, with pleasure; please
  hook: >-
    `graag` kulağa bir karganın 'grak!' sesi gibi gelir. Sahne: çok kibar bir karga taal café'de
    tezgâha konuyor ve 'Een koffie, grak… graag!' diyor. Kibar karga hep `graag` der.
  trap:
    from: en
    text: >-
      İngilizcede ‘sevmek’ için hep `like` kullanırsın, bu yüzden `Ik like padel` ya da `Ik vind
      padel graag` gibi bir şey kurarsın. Hollandacada bir şeyi severek yapmak: fiil + `graag`: `Ik
      speel graag padel.` `graag` fiilin hemen arkasına gelir, ayrı bir ‘sevmek’ fiili yoktur.
  pictures:
    hook: >-
